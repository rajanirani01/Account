<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Information - Accountify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      margin: 0;
      padding: 0;
    }

    .page-container {
      display: grid;
      grid-template-columns: 240px 1fr;
      width: 100%;
      min-height: 100vh;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.95);
      border-right: 1px solid #e5e9f2;
      padding: 24px 0;
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(15, 23, 42, 0.06);
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      color: #4b5563;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .sidebar-item:hover {
      background: rgba(45, 92, 201, 0.08);
      color: #2d5cc9;
    }

    .sidebar-item.active {
      background: rgba(45, 92, 201, 0.12);
      color: #2d5cc9;
      border-left: 3px solid #2d5cc9;
      padding-left: 17px;
    }

    .sidebar-section-title {
      padding: 18px 20px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-submenu {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: 20px;
    }

    .sidebar-submenu .sidebar-item {
      padding: 10px 16px;
      font-size: 0.88rem;
    }

    .main-content {
      margin-left: 240px;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    .account-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .account-header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      width: 280px;
      padding: 12px 16px;
      border: 1px solid #d3d8e6;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #4b5563;
      font-size: 0.92rem;
    }

    .search-box::placeholder {
      color: #94a3b8;
    }

    .user-profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a8c5ff, #d9e7ff);
      display: grid;
      place-items: center;
      color: #2d5cc9;
      font-weight: 700;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
    }

    .user-email {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: #64748b;
    }

    .account-content {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #e5e9f2;
      border-radius: 24px;
      padding: 32px;
    }

    .profile-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid #f0f4f8;
    }

    .avatar-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-lg {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a8c5ff, #d9e7ff);
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      position: relative;
    }

    .avatar-camera {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2d5cc9;
      border: 3px solid white;
      display: grid;
      place-items: center;
      color: white;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #3d4a5a;
      font-size: 0.92rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .form-input {
      padding: 12px 14px;
      border: 1px solid #d3d8e6;
      border-radius: 16px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 0.92rem;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #2d5cc9;
      box-shadow: 0 0 0 5px rgba(45, 92, 201, 0.1);
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
      color: #1f7a52;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .verified-badge::before {
      content: '✓';
      color: #1f7a52;
    }

    .field-actions {
      display: flex;
      gap: 12px;
      margin-left: auto;
    }

    .btn-edit {
      padding: 8px 14px;
      border: none;
      border-radius: 12px;
      background: rgba(45, 92, 201, 0.1);
      color: #2d5cc9;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-edit:hover {
      background: rgba(45, 92, 201, 0.18);
    }

    .btn-save {
      padding: 8px 14px;
      border: none;
      border-radius: 12px;
      background: rgba(45, 92, 201, 0.12);
      color: #2d5cc9;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-save:hover {
      background: rgba(45, 92, 201, 0.2);
    }

    .bio-section {
      margin-top: 28px;
    }

    .bio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .bio-header label {
      font-weight: 700;
      color: #0f172a;
    }

    .bio-textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px;
      border: 1px solid #d3d8e6;
      border-radius: 16px;
      background: #f8fafc;
      color: #0f172a;
      font-family: inherit;
      font-size: 0.92rem;
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .bio-textarea:focus {
      outline: none;
      border-color: #2d5cc9;
      box-shadow: 0 0 0 5px rgba(45, 92, 201, 0.1);
    }

    @media (max-width: 1024px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .profile-section {
        grid-template-columns: 1fr;
      }

      .page-container {
        grid-template-columns: 200px 1fr;
      }

      .main-content {
        margin-left: 200px;
      }

      .sidebar {
        width: 200px;
      }
    }

    @media (max-width: 768px) {
      .page-container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid #e5e9f2;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .account-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        flex-direction: column;
      }

      .search-box {
        width: 100%;
      }

      .user-profile-header {
        width: 100%;
        justify-content: space-between;
      }

      .user-info {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <aside class="sidebar">
      <div class="sidebar-item" style="margin-bottom: 20px;">
        <span style="font-size: 1.2rem;">📊</span>
        <span style="font-weight: 700; color: #0f172a;">Puzzler</span>
      </div>
      <a href="index.html" class="sidebar-item">
        <span>📈</span>
        <span>Dashboard</span>
      </a>
      <a href="#" class="sidebar-item">
        <span>📋</span>
        <span>Order</span>
      </a>
      <a href="#" class="sidebar-item">
        <span>📦</span>
        <span>Product</span>
      </a>
      <a href="#" class="sidebar-item">
        <span>👤</span>
        <span>Customer</span>
      </a>
      <a href="#" class="sidebar-item">
        <span>👥</span>
        <span>Employee</span>
      </a>
      <a href="#" class="sidebar-item">
        <span>💳</span>
        <span>Billing</span>
      </a>
      <a href="#" class="sidebar-item">
        <span>📊</span>
        <span>Analytics</span>
      </a>
      <div style="margin-top: 24px;">
        <div class="sidebar-section-title">Settings</div>
        <div class="sidebar-submenu">
          <a href="account-info.html" class="sidebar-item active">
            <span>👤</span>
            <span>Account Information</span>
          </a>
          <a href="#" class="sidebar-item">
            <span>🔑</span>
            <span>Change Password</span>
          </a>
          <a href="#" class="sidebar-item">
            <span>🔔</span>
            <span>Notification</span>
          </a>
          <a href="#" class="sidebar-item">
            <span>🎨</span>
            <span>Personalization</span>
          </a>
          <a href="#" class="sidebar-item">
            <span>🔒</span>
            <span>Security & Privacy</span>
          </a>
        </div>
      </div>
      <a href="#" class="sidebar-item" style="margin-top: 24px;">
        <span>❓</span>
        <span>Help</span>
      </a>
      <a href="index.html" class="sidebar-item" style="margin-top: 12px;">
        <span>🚪</span>
        <span>Log out</span>
      </a>
    </aside>

    <main class="main-content">
      <div class="account-header">
        <h1>Account Information</h1>
        <div class="header-actions">
          <input type="text" class="search-box" placeholder="Search" />
          <div class="user-profile-header">
            <div style="display: flex; gap: 12px; align-items: center;">
              <svg style="width: 24px; height: 24px; color: #94a3b8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              <svg style="width: 24px; height: 24px; color: #94a3b8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 0-7 7v4l-1.6 1.6a1 1 0 0 0 .7 1.7h16a1 1 0 0 0 .7-1.7L19 13V9a7 7 0 0 0-7-7Zm0 20a3 3 0 0 0 2.83-2H9.17A3 3 0 0 0 12 22Z"/></svg>
            </div>
            <div class="user-avatar">J</div>
            <div class="user-info">
              <p class="user-name">Jane Cooper</p>
              <p class="user-email">jane234@example.com</p>
            </div>
          </div>
        </div>
      </div>

      <div class="account-content">
        <div class="profile-section">
          <div class="avatar-upload">
            <div class="avatar-lg">
              <div class="avatar-camera">📷</div>
            </div>
          </div>

          <div>
            <div class="form-row">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-input" value="Jane" />
              </div>
              <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <label>Last Name</label>
                  <div class="field-actions">
                    <button class="btn-edit">Edit</button>
                    <button class="btn-save">Save</button>
                  </div>
                </div>
                <input type="text" class="form-input" value="Coop" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Email <span class="verified-badge">Verified</span></label>
                <input type="email" class="form-input" value="jane234@example.com" />
              </div>
              <div class="form-group">
                <label>Phone Number <span class="verified-badge">Verified</span></label>
                <input type="tel" class="form-input" value="(209) 555-0104" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" class="form-input" value="17 nov, 1996" />
              </div>
              <div class="form-group">
                <label>Country</label>
                <select class="form-input" style="cursor: pointer;">
                  <option>Bangladesh</option>
                  <option>United States</option>
                  <option>United Kingdom</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="bio-section">
          <div class="bio-header">
            <label>Bio</label>
            <button class="btn-edit">Edit</button>
          </div>
          <textarea class="bio-textarea" readonly>Passionate about connecting businesses with the goodness of nature! 🌱 I'm on a mission to make organic food, medicine, fruits, and FMCG products easily accessible to B2B partners. 🌾 Health and sustainability drive my business ethos. 🌿 I love working closely with businesses that share our values. Let's grow together! 🌾</textarea>
        </div>
      </div>
    </main>
  </div>
</body>
